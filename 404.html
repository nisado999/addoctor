<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found – AdDoctor</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="64x64" href="/addoctor/favicon-64.png" data-path="favicon-64.png" />
    <link rel="apple-touch-icon" href="/addoctor/apple-touch-icon.png" data-path="apple-touch-icon.png" />
    <style>
      /* GitHub Pages shows this for any address that does not exist. Links are absolute because the missing address can be at any depth. */
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 420px; padding: 32px 24px; text-align: center; }
      img { height: 34px; }
      h1 { margin: 28px 0 8px; font-size: 28px; letter-spacing: -0.02em; }
      p { margin: 0 0 24px; color: #64748b; }
      a.btn { display: inline-block; padding: 12px 22px; border-radius: 999px; background: #2563eb; color: #fff; font-weight: 600; text-decoration: none; box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25); }
      a.btn:hover { background: #1d4ed8; }
      a:focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; border-radius: 999px; }
      .links { margin-top: 18px; font-size: 14px; }
      .links a { color: #2563eb; text-decoration: none; margin: 0 8px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/addoctor/logo.png" data-path="logo.png" alt="AdDoctor" />
      <h1>This page doesn't exist</h1>
      <p>The link may be old or mistyped. Everything in AdDoctor starts from the template gallery.</p>
      <a class="btn" href="/addoctor/" data-path="">Browse ad templates</a>
      <div class="links"><a href="/addoctor/#spy" data-path="#spy">Competitor Spy</a><a href="/addoctor/#pack" data-path="#pack">Social Pack</a></div>
    </main>
    <script>
      /* The addresses above assume the site lives at /addoctor/, as it does on nisado999.github.io. A project site on
         github.io always sits under its repository's name, so read that from the address instead; on any other host
         (a custom domain serves the site from its root) use the root. Without scripts the addresses above stay. */
      (function () {
        var seg = location.pathname.split("/")[1] || "";
        var base = /\.github\.io$/.test(location.hostname) ? (seg ? "/" + seg + "/" : "/") : "/";
        if (base === "/addoctor/") return;
        var els = document.querySelectorAll("[data-path]");
        for (var i = 0; i < els.length; i++) {
          var el = els[i], attr = el.tagName === "IMG" ? "src" : "href";
          el.setAttribute(attr, base + el.getAttribute("data-path"));
        }
      })();
    </script>
  </body>
</html>
